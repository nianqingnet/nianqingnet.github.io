<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>广东关键词检测稳定版</title>

<style>
body{font-family:Arial;margin:30px;}
input{width:650px;padding:6px;}
button{padding:6px 12px;}

#result{margin-top:20px;}

.hit{
color:#c00000;
font-weight:bold;
margin:12px 0;
}

.debug{
background:#f3f3f3;
padding:6px;
margin:6px 0;
font-size:13px;
}
</style>
</head>

<body>

<h2>广东关键词检测（稳定版）</h2>

<input id="startUrl"
value="http://paper.ce.cn/pc/content/202603/16/content_329650.html">

<button onclick="start()">开始检测</button>

<div id="result"></div>

<script>

const keywords=[
"广东","广州","深圳","珠海","佛山","东莞","中山","江门",
"惠州","汕头","汕尾","潮州","揭阳","湛江","茂名","阳江",
"肇庆","清远","河源","梅州","韶关","云浮",
"粤港澳","大湾区","南沙","南海",
"中山大学","暨南大学","华南理工大学","华南师范大学"
]

function log(msg){
console.log(msg)
document.getElementById("result").innerHTML+=
"<div class='debug'>"+msg+"</div>"
}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms))
}

function parseId(url){
let m=url.match(/content_(\d+)/)
if(m) return parseInt(m[1])
return 0
}

function buildUrl(url,id){
return url.replace(/content_\d+/,"content_"+id)
}



/* 判断是否报纸404 */

function isPaper404(html){

if(!html) return true

if(html.includes("404 Not Found")) return true

if(html.includes("Not Found")) return true

if(html.includes("该日无报纸")) return true

return false

}



/* 稳定抓取 */

async function fetchPage(url){

const proxies=[
"",
"https://cors.isomorphic-git.org/",
"https://api.allorigins.win/raw?url="
]

for(let retry=1;retry<=20;retry++){

for(let p of proxies){

try{

let r=await fetch(p+url)

if(r.ok){

let html=await r.text()

return html

}

}catch(e){}

}

log("抓取失败，第 "+retry+" 次重试")

await sleep(retry*1000)

}

throw new Error("抓取失败")

}



async function start(){

document.getElementById("result").innerHTML=""

let startUrl=document.getElementById("startUrl").value.trim()

let id=parseId(startUrl)

let endCount=0

log("起始ID："+id)



while(true){

let url=buildUrl(startUrl,id)

let html=""

try{

html=await fetchPage(url)

}catch(e){

log("异常："+url)
log("错误："+e.message)

id++
await sleep(1000)
continue

}



/* 判断报纸结束 */

if(isPaper404(html)){

log("报纸结束页："+url)

endCount++

if(endCount>=2){

log("******** 检索结束 ********")
break

}

id++
await sleep(1000)
continue

}

endCount=0



let doc=new DOMParser().parseFromString(html,"text/html")



/* 标题 */

let title=""

let t1=doc.querySelector("#Title")

if(t1) title=t1.innerText.trim()

if(!title){

let t2=doc.querySelector("h1,h2,h3")

if(t2) title=t2.innerText.trim()

}



/* 正文 */

let body=""

let a=doc.querySelector("#articleContent")
let b=doc.querySelector("#ozoom")
let c=doc.querySelector(".m-article-main")

if(a) body+=a.textContent
if(b) body+=b.textContent
if(c) body+=c.textContent



let text=(title+" "+body)

let cleanText=text.replace(/\s+/g,"")



log("检测URL："+url)

log("标题："+title)

log("正文长度："+cleanText.length)

log("text.indexOf('大河源头')="+cleanText.indexOf("大河源头"))

log("text.indexOf('江河源头')="+cleanText.indexOf("江河源头"))

log("text.indexOf('大江大河源头')="+cleanText.indexOf("大江大河源头"))



/* 广东上下文 */

let hasGD=false

for(let k of keywords){

if(k==="河源"||k==="中山"||k==="南沙"||k==="南海") continue

if(cleanText.includes(k)){
hasGD=true
break
}

}



let matches=[]



for(let keyword of keywords){

if(!cleanText.includes(keyword)) continue



/* 中山 */

if(keyword==="中山"){

let arr=[...cleanText.matchAll(/中山/g)]

let ok=false

for(let m of arr){

if(cleanText.substr(m.index-1,1)!=="孙"){
ok=true
break
}

}

if(!ok && !hasGD) continue

}



/* 河源 */

if(keyword==="河源"){

if(
(cleanText.includes("江河源头")
||cleanText.includes("大河源头")
||cleanText.includes("大江大河源头"))
&&!hasGD
){
log("触发河源排除")
continue
}

}



/* 南沙 */

if(keyword==="南沙"){

if(cleanText.includes("南沙群岛") && !hasGD){
log("触发南沙排除")
continue
}

}



/* 南海 */

if(keyword==="南海"){

if(cleanText.includes("南海问题") && !hasGD){
log("触发南海排除")
continue
}

}



matches.push(keyword)

}



/* 输出 */

if(matches.length>0){

document.getElementById("result").innerHTML+=
"<div class='hit'>"+
"<a href='"+url+"' target='_blank'>"+title+"</a><br>"+
"命中关键词："+matches.join(",")+
"</div>"

}else{

log("未命中关键词")

}



id++

await sleep(1000)

}



}

</script>

</body>
</html>
