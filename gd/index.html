<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>纸媒广东内容检索</title>

<style>

body{
font-family:Arial;
padding:20px;
}

textarea{
width:100%;
height:60px;
}

button{
padding:8px 20px;
margin-top:10px;
}

#log{
margin-top:20px;
}

.result{
border-bottom:1px solid #ddd;
padding:10px 0;
}

.hit{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<h2>纸媒涉及广东内容检索页</h2>

起始文章URL：

<textarea id="startUrl"></textarea>

<br>

<button onclick="start()">开始检测</button>

<div id="log"></div>

<script>

const keywords=[

"广东","粤港澳","粤港澳大湾区",

"广州","深圳","珠海","汕头","佛山","韶关","湛江","肇庆","江门",
"茂名","惠州","梅州","汕尾","河源","阳江","清远","东莞","中山",
"潮州","揭阳","云浮",
"粤东","粤西","粤北","南粤",
"南沙","前海","横琴",

"中山大学","暨南大学","华南理工大学","华南师范大学",
"华南农业大学","南方科技大学","深圳大学","广州大学",
"广东工业大学","广东外语外贸大学"

]

let stopFail=6
let failCount=0

function log(t){

document.getElementById("log").innerHTML+=t

}

function parseUrl(url){

let m=url.match(/content_(\d+)\.html/)

return{

base:url.replace(/content_\d+\.html/,"content_"),

id:parseInt(m[1])

}

}

function hasGDContext(text){

return keywords.some(k=>text.includes(k))

}

function keywordValid(keyword,text){

let hasGD=hasGDContext(text)

if(keyword==="中山"){

if(!text.includes("中山")) return false

if(text.includes("孙中山") && !hasGD) return false

return true

}

if(keyword==="河源"){

if(!text.includes("河源")) return false

if(

(text.includes("江河源头")
||text.includes("大河源头"))

&&!hasGD

){

return false

}

return true

}

if(keyword==="南沙"){

if(!text.includes("南沙")) return false

if(text.includes("南沙群岛") && !hasGD){

return false

}

return true

}

if(keyword==="南海"){

if(!text.includes("南海")) return false

if(

(text.includes("南海问题")
||text.includes("南海局势")
||text.includes("南海仲裁")
||text.includes("南海争议"))

&&!hasGD

){

return false

}

return true

}

return text.includes(keyword)

}

function match(text){

let found=[]

keywords.forEach(k=>{

if(keywordValid(k,text)){

found.push(k)

}

})

return [...new Set(found)]

}

async function fetchArticle(url){

try{

let r=await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url))

if(!r.ok) return null

let html=await r.text()

return html

}catch(e){

return null

}

}

function parseArticle(html){

let doc=new DOMParser().parseFromString(html,"text/html")

let h1=doc.querySelector("h1")?.innerText||""

let h2=doc.querySelector("h2")?.innerText||""

let h3=doc.querySelector("h3")?.innerText||""

let body=""

let a=doc.querySelector("#articleContent")

let b=doc.querySelector("#ozoom")

let c=doc.querySelector(".m-article-main")

if(a) body+=a.innerText

if(b) body+=" "+b.innerText

if(c) body+=" "+c.innerText

if(!body){

body=doc.body.innerText

}

let text=(h1+h2+h3+body).replace(/\s+/g,"")

return{

title:h1||h2||"(无标题)",

text:text

}

}

async function start(){

document.getElementById("log").innerHTML=""

let startUrl=document.getElementById("startUrl").value.trim()

let p=parseUrl(startUrl)

let base=p.base

let id=p.id

log("开始扫描ID："+id+"<br><br>")

while(true){

let url=base+id+".html"

let html=await fetchArticle(url)

if(!html){

failCount++

if(failCount>=stopFail){

log("<br>连续"+stopFail+"篇失败，停止<br>")

break

}

id++

continue

}

failCount=0

let art=parseArticle(html)

let hits=match(art.text)

if(hits.length){

log(

`<div class="result">

<span class="hit">命中关键词：</span>${hits.join(", ")}

<br>

<a href="${url}" target="_blank">${art.title}</a>

</div>`

)

}

id++

}

log("<br>检测结束，最后扫描ID："+(id-1))

}

</script>

</body>

</html>
