<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸媒涉及广东内容检索页</title>
<style>
:root{--bg:#fbf8ea;--ink:#222;--text:#333;--muted:#7d776a;--accent:#1f6f6b;--accent-dark:#175451;--line:#e3dcc4;--card:#fff;--hit:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-dark);text-decoration:underline}
.wrap{width:min(1280px,100%);margin:0 auto;padding:36px clamp(16px,4vw,64px)}
h2,h3{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;color:var(--ink);letter-spacing:2px}
.page-title{font-size:28px;margin:0 0 4px}
.kicker{font-size:12px;letter-spacing:5px;color:var(--muted);margin-bottom:22px}
.panel{background:var(--card);border:1px solid var(--line);padding:22px 24px;margin-bottom:22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input#urlInput{flex:1 1 520px;min-width:0;padding:9px 12px;font-size:14px;border:1px solid var(--line);border-radius:3px;background:#fffdf6;color:var(--ink)}
input#urlInput:focus{outline:none;border-color:var(--accent)}
button{font:inherit;font-size:14px;padding:7px 18px;border-radius:3px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
button:hover{background:#eef5f4}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark)}
button:disabled{opacity:.45;cursor:default}
#status{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.8em}
.block-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.block-head h2{font-size:20px;margin:0 auto 0 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;background:#faf6e6;white-space:nowrap}
tbody tr:hover{background:#fdfbf2}
td.id{white-space:nowrap;color:var(--muted)}
td.kw{color:var(--hit)}
td.act{white-space:nowrap}
td.act a,td.act button{margin-right:6px}
button.small{font-size:12px;padding:2px 10px}
#errorBlock h3{font-size:17px;margin:0 0 10px;color:#8a4b2a}
</style>
</head>
<body>
<div class="wrap">
<h2 class="page-title">纸媒涉及广东内容检索页</h2>
<div class="kicker">人民日报 · 光明日报 · 经济日报</div>

<div class="panel">
<div class="bar">
<input type="text" id="urlInput" placeholder="请输入各报以node_01.html结尾的头版链接">
<button id="btnStart" class="primary" onclick="start()">开始检测</button>
<button onclick="pause()">暂停</button>
<button onclick="resume()">继续</button>
<button onclick="stop()">停止</button>
</div>
<div id="status"></div>
</div>

<div id="hitBlock" class="panel" style="display:none">
    <div class="block-head">
        <h2>命中结果</h2>
        <button onclick="copyToClipboard()">一键复制简报</button>
        <button onclick="exportToTxt()">导出 TXT</button>
    </div>
    <table id="hitTable">
        <thead>
            <tr>
                <th>ID (版面)</th>
                <th>文章标题 (字数)</th>
                <th>命中关键词(频次)</th>
                <th>链接</th>
                <th>高亮预览</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div id="errorBlock" class="panel" style="display:none">
<h3>抓取异常请人工检索</h3>
<table id="errorTable">
<tr><th>序号</th><th>URL</th></tr>
</table>
</div>
</div>

<script>
const keywords = [
    "广东", "粤港澳", "粤港澳大湾区",
    "广州", "深圳", "珠海", "汕头", "佛山", "韶关", "湛江", "肇庆", "江门",
    "茂名", "惠州", "梅州", "汕尾", "河源", "阳江", "清远", "东莞", "中山",
    "潮州", "揭阳", "云浮",
    "粤东", "粤西", "粤北", "南粤","岭南","潮汕","珠三角",
    "南沙", "前海", "横琴","琴澳",
    "中山大学", "暨南大学", "华南理工大学", "华南师范大学",
    "华南农业大学", "南方科技大学", "深圳大学", "广州大学",
    "广东工业大学", "广东外语外贸大学",
    "华为", "腾讯", "网易", "广汽","比亚迪","小鹏汽车","大疆","格力",
    "粤剧","粤语","粤菜","粤曲","粤超","粤BA","广交会"
];

// 1. 确保所有全局计数器已定义
let running = false, paused = false, id = 0, scanCount = 0, endCount = 0, baseUrl = "", completedCount = 0, errorCount = 0;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function randomDelay() { return 800 + Math.random() * 1000; }
function parseId(url) { let m = url.match(/content_(\d+)/); return m ? parseInt(m[1]) : 0; }
function buildUrl(url, id) { return url.replace(/content_\d+/, "content_" + id); }

// --- 配置区 ---
const myWorker = "https://readpaper.nianqing.net/?url=";
const publicProxies = ["https://api.allorigins.win/raw?url=", "https://corsproxy.io/?"];

function isPaper404(html) {
    if (!html || html.trim() === "404") return true;
    const h = html.toLowerCase();
    const errorKeywords = ["not found", "该日无报纸", "404 not found", "页面不存在"];
    if (errorKeywords.some(kw => h.includes(kw))) return true;
    if (html.length < 200 && h.includes("404")) return true;
    return false;
}

async function fetchPage(url) {
    const MAX_RETRIES = 5;
    let attempt = 0;
    while (attempt < MAX_RETRIES) {
        const proxyList = [myWorker, ...publicProxies.sort(() => Math.random() - 0.5)];
        for (let proxy of proxyList) {
            try {
                const requestUrl = proxy + encodeURIComponent(url);
                let r = await fetch(requestUrl);
                if (r.ok || r.status === 404) {
                    const text = await r.text();
                    return text || "404";
                }
            } catch (e) { console.warn(`${proxy} 连接失败`); }
        }
        attempt++;
        await sleep(1000 + (attempt * 500));
    }
    throw new Error("全部代理失效");
}

function addHit(title, matches, url, version) {
    document.getElementById("hitBlock").style.display = "block";
    let tbody = document.querySelector("#hitTable tbody");
    let row = tbody.insertRow(-1);

    // 0. ID 和 版面
    let displayId = url.match(/content_(\d+)/) ? url.match(/content_(\d+)/)[1] : "N/A";
    let c0 = row.insertCell(0); c0.className = "id";
    c0.innerText = displayId + " (" + (version || '未知') + ")";

    // 1. 标题
    row.insertCell(1).innerText = title;

    // 2. 关键词
    let c2 = row.insertCell(2); c2.className = "kw";
    c2.innerText = matches.join(", ");

    // 3. 原文链接
    let c3 = row.insertCell(3); c3.className = "act";
    let a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.innerText = "打开原文";
    c3.appendChild(a);

    // 4. 套红预览
    let c4 = row.insertCell(4); c4.className = "act";
    let btn = document.createElement("button");
    btn.className = "small";
    btn.innerText = "套红预览";
    btn.onclick = function() { openRedContent(url, title, matches); };
    c4.appendChild(btn);
}

function addError(id, url) {
    document.getElementById("errorBlock").style.display = "block";
    let table = document.getElementById("errorTable");
    let row = table.insertRow(-1);
    row.insertCell(0).innerText = id;
    let a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.innerText = url;
    row.insertCell(1).appendChild(a);
}

function pause() { paused = true; document.getElementById("status").innerText = "检测已暂停"; }
function resume() { paused = false; }
function stop() { running = false; paused = false; document.getElementById("status").innerText = "正在停止..."; } // 这里不需要重新调loop，loop内部在跑

async function scanFullDay(startNodeUrl) {
    let allTaskLinks = [];
    const baseUrl = startNodeUrl.substring(0, startNodeUrl.lastIndexOf('/') + 1);
    let emptyPageCount = 0; // 沿用你的变量名

    document.getElementById("status").innerText = "正在分析报纸目录结构...";

    try {
        // 1. 先抓取初始页面分析结构
        let html = await fetchPage(startNodeUrl);
        let doc = new DOMParser().parseFromString(html, "text/html");
        
        // --- 优先检查：是否存在全量目录 (经济日报PAD版特征) ---
        let catalog = doc.getElementById("catalog");
        if (catalog) {
            let links = catalog.querySelectorAll("a");
            links.forEach(el => {
                let href = el.getAttribute('href');
                if (href && href.includes('content_')) {
                    let absoluteUrl = new URL(href, startNodeUrl).href;
                    if (!allTaskLinks.includes(absoluteUrl)) allTaskLinks.push(absoluteUrl);
                }
            });
            if (allTaskLinks.length > 0) {
                document.getElementById("status").innerText = `检测到全量目录，共 ${allTaskLinks.length} 篇文章`;
                return allTaskLinks; // 抓完直接返回，不走下面的循环
            }
        }

        // --- 保底方案：你原本的逐版循环逻辑 (适配人民、光明等) ---
        for (let i = 1; i <= 25; i++) {
            if (!running) break;
            
            let nodeName = "node_" + i.toString().padStart(2, '0') + ".html";
            let currentLayoutUrl = baseUrl + nodeName;
            
            document.getElementById("status").innerText = "正在扫描目录：第 " + i + " 版...";
            
            try {
                // 如果是第1版，直接复用刚才抓过的 html，省一次请求
                let pageHtml = (i === 1) ? html : await fetchPage(currentLayoutUrl);
                
                // 判定为 404 或空版面
                if (isPaper404(pageHtml) || pageHtml.length < 500) {
                    emptyPageCount++;
                    if (emptyPageCount >= 2) {
                        console.log("检测到连续 2 个空版，判断本日报纸结束。");
                        break; 
                    }
                    continue;
                }

                emptyPageCount = 0; // 重置
                
                let pageDoc = new DOMParser().parseFromString(pageHtml, "text/html");
                // 增加 .list_t a 这种常见于其他报纸的选择器
                let links = pageDoc.querySelectorAll(".news-list a, .newsList a, .m-list-wrap a, map area, .list_t a");
                
                links.forEach(el => {
                    let href = el.getAttribute('href');
                    if (href && href.includes('content_')) {
                        let absoluteUrl = new URL(href, currentLayoutUrl).href;
                        if (!allTaskLinks.includes(absoluteUrl)) allTaskLinks.push(absoluteUrl);
                    }
                });
                await sleep(300); 
            } catch (e) {
                emptyPageCount++;
                if (emptyPageCount >= 2) break;
            }
        }
    } catch (e) {
        console.error("解析初始页面失败:", e);
    }
    
    return allTaskLinks;
}

async function start() {
    // 防止重复点击：上一轮还在跑时不再开新一轮
    if (running) { alert("检测正在进行中，请先停止或等待完成"); return; }
    const inputUrl0 = document.getElementById("urlInput").value.trim();
    if (!inputUrl0) { alert("请输入起始链接"); return; }
    document.getElementById("btnStart").disabled = true;
    try { await startInner(); }
    finally { running = false; paused = false; document.getElementById("btnStart").disabled = false; }
}

async function startInner() {
    // 1. 强制重置所有全局变量
    running = true; 
    endCount = 0;
    paused = false;
    completedCount = 0; 
    errorCount = 0;
    
    // 2. 彻底清空 UI 界面
    document.getElementById("status").innerText = "准备开始...";
    const hitTableBody = document.querySelector("#hitTable tbody");
    if (hitTableBody) hitTableBody.innerHTML = ""; // 清空表格内容
    document.getElementById("hitBlock").style.display = "none";
    document.getElementById("errorBlock").style.display = "none";

    // 3. 获取输入
    const inputEl = document.getElementById("urlInput");
    let inputUrl = inputEl.value.trim();
    if (!inputUrl) { alert("请输入起始链接"); return; }

    // 4. 执行逻辑
    if (inputUrl.includes("node_")) {
        let taskList = await scanFullDay(inputUrl);
        // 只要扫到了稿件，就去处理，不弹窗报错
        if (taskList.length > 0) {
            await executeTaskQueue(taskList);
        } else {
            document.getElementById("status").innerText = "未发现有效稿件，请检查链接。";
        }
    } else if (inputUrl.includes("content_")) {
        await executeIncremental(inputUrl);
    }
}

// --- 执行器 A：按清单爬取 (光明日报常用) ---
async function executeTaskQueue(list) {
    let count = 0;
    for (let url of list) {
        if (!running) break;
        while (paused) await sleep(500);
        document.getElementById("status").innerText = `进度：${count + 1} / ${list.length}`;
        try {
            let html = await fetchPage(url);
            processArticle(html, url); 
            count++;
        } catch (e) { 
            console.error("抓取失败", url); 
            errorCount++; 
        }
        await sleep(randomDelay());
    }
    document.getElementById("status").innerHTML = 
        `<span style="color:green;">目录检索模式：全部完成！</span><br>` +
        `共处理：${count} 篇，命中：${completedCount} 篇，异常：${errorCount} 篇`;
}

// --- 执行器 B：按 ID 递增爬取 (人日/经济常用) ---
async function executeIncremental(startUrl) {
    baseUrl = startUrl; // 记录基础URL
    id = parseId(startUrl);
    let foundCount = 0;
    while (running) {
        if (!running) break;
        while (paused) await sleep(500);
        let url = buildUrl(baseUrl, id);
        document.getElementById("status").innerText = `递增模式：正在检测 ID ${id} ...`;
        try {
            let html = await fetchPage(url);
            if (isPaper404(html)) {
                endCount++;
                if (endCount >= 2) break;
            } else {
                endCount = 0;
                foundCount++;
                processArticle(html, url);
            }
        } catch (e) { 
            errorCount++; 
            addError(id, url); 
        }
        id++;
        await sleep(randomDelay());
    }
    document.getElementById("status").innerHTML = 
        `<span style="color:green;">递增检索结束！</span><br>` +
        `共分析：${foundCount} 篇，命中：${completedCount} 篇，异常：${errorCount} 篇`;
}

function incrementContentId(url) {
    return url.replace(/content_(\d+)/, (match, id) => "content_" + (parseInt(id) + 1));
}

// 光明日报把作者简介、图片说明放在 HTML 注释 <!-- --> 里，页面上看不到，但对检索很重要
function commentText(root) {
    let out = [];
    let walker = document.createTreeWalker(root, NodeFilter.SHOW_COMMENT);
    let n;
    while ((n = walker.nextNode())) {
        let frag = new DOMParser().parseFromString(n.nodeValue, "text/html");
        out.push(frag.body.textContent);
    }
    return out.join(" ");
}

function processArticle(html, url) {
    let doc = new DOMParser().parseFromString(html, "text/html");

    // --- 1. 标题提取 (支持经济日报移动端 #intro-title, #main-title, #sub-title) ---
    let title = "";
    let pre = doc.querySelector("#PreTitle, .introtitle, .article h3, .m-article-content h3, .mob-introTitle, #intro-title");
    let main = doc.querySelector("#Title, .article h1, .m-article-content h1, .art-title, .title, .mob-title, #main-title");
    let sub = doc.querySelector("#SubTitle, .subtitle, .article h2, .m-article-content h2, .subTitle, .mob-subtitle, #sub-title");

    if (main) {
        let t1 = pre ? pre.innerText.trim() : ""; 
        let t2 = main.innerText.trim();           
        let t3 = sub ? sub.innerText.trim() : ""; 
        // 过滤掉空字符串并用分隔符连接
        title = [t1, t2, t3].filter(Boolean).join(" | ");
    } else {
        // 兜底方案
        let backup = doc.querySelector("h1, h2, .title, .mob-title");
        title = backup ? backup.innerText.trim() : "无标题";
    }

    // --- 2. 正文提取 ---
    let body = "";
    let ozoom = doc.querySelector("#ozoom");               // 人民日报
    let artContent = doc.querySelector("#articleContent"); // 经济日报PC
    // 光明日报：用 .m-article-text（外层容器，含注释里的作者简介、图片说明）
    let gmrContent = doc.querySelector(".m-article-text") || doc.querySelector(".m-article-content") || doc.querySelector(".m-article-main");
    let padContent = doc.querySelector("founder-content"); // 经济日报移动版(PAD)
    
    if (ozoom) { body = ozoom.innerText; } 
    else if (artContent) { body = artContent.innerText; } 
    else if (gmrContent) { body = gmrContent.innerText + " " + commentText(gmrContent); }
    else if (padContent) { body = padContent.innerText; }

    // 清理多余空格，进行长度校验
    let text = (title + " " + body).replace(/\s+/g, "");
    if (text.length < 15) return; 

    // --- 3. 关键词检测 (重构后的逻辑) ---
    let matches = [];
    // 将排除规则定义在循环外，提高效率
    const excludeRules = {
        "中山": [/孙中山/g, /中山装/g, /中山陵/g],
        "南海": [/南海问题/g, /南海仲裁/g, /南海观音/g],
        "南沙": [/南沙群岛/g],
        "河源": [/江河源头/g, /大河源头/g, /渭河源/g],
        "前海": [/目前海/g],          // “目前海外”“目前海南”等
        "江门": [/长江门户/g]
    };
    
    for (let keyword of keywords) {
        // 1. 初步检查，如果根本不包含关键词，直接跳过
        if (!text.includes(keyword)) continue;
    
        let tempText = text;
    
        // 2. 命中排除规则：如果有定义该关键词的排除逻辑，则执行替换
        if (excludeRules[keyword]) {
            excludeRules[keyword].forEach(rule => {
                tempText = tempText.replace(rule, "###");
            });
        }
        // 3. 二次检查并计数：排除后是否依然包含关键词
        if (tempText.includes(keyword)) {
            // 使用 split 计数是简单高效的方法
            let count = tempText.split(keyword).length - 1;
            if (count > 0) {
                matches.push(keyword + "(" + count + "次)");
            }
        }
    }
    
    // --- 4. 版面识别  ---
    let versionInfo = "未知";
    // 提前获取所有可能的坑位
    let versionMatch = html.match(/(\d{2}版)|第\s*(\d{2})\s*版/);
    let padLayout = doc.querySelector("#nowLayout");
    let gmrLayout = doc.querySelector(".m-info-left span");

    // 修改判断顺序：先看精准容器，再看模糊正则
    if (padLayout && padLayout.innerText.trim() !== "") {
        // 经济日报/移动端
        versionInfo = padLayout.innerText.replace(/[^0-9]/g, "").trim();
    } else if (gmrLayout && gmrLayout.innerText.trim() !== "") {
        // 光明日报 PC 版
        versionInfo = gmrLayout.innerText.replace(/[^0-9]/g, "").trim();
    } else if (versionMatch) {
        // 人民日报或兜底
        versionInfo = versionMatch[0].replace(/[第版]/g, "").trim();
    }
    
    // --- 5. 输出结果 ---
    if (matches.length > 0) {
        completedCount++;// 只有命中才增加完成数（用于简报计数）
        addHit(title + " [" + text.length + "字]", matches, url, versionInfo);
    }
}

function getResultText() {
    let table = document.getElementById("hitTable");
    let rows = table.getElementsByTagName("tr");
    let content = "";
    for (let i = 1; i < rows.length; i++) {
        let cells = rows[i].getElementsByTagName("td");
        if (cells.length > 0) {
            content += `${i}. ${cells[1].innerText} (命中：${cells[2].innerText})\n${cells[3].querySelector("a").href}\n\n`;
        }
    }
    return content;
}

function exportToTxt() {
    let content = getResultText();
    if (!content) return alert("没有结果可导出");
    let blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `检索简报_${new Date().toLocaleDateString()}.txt`;
    link.click();
}

function copyToClipboard() {
    let content = getResultText();
    if (!content) return alert("没有结果可复制");
    navigator.clipboard.writeText(content).then(() => alert("已成功复制！")).catch(err => alert("复制失败"));
}

// ---------- 套红预览：只取正文区域，排成干净的阅读页 ----------
function escapeHtml(t) {
    return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// 只在文字节点里套红，不碰标签和属性；长词优先（中山大学 先于 中山）
function highlightNode(root, doc) {
    const sorted = [...keywords].sort((a, b) => b.length - a.length);
    const reg = new RegExp("(" + sorted.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "g");
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) {
        if (n.parentNode && /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) continue;
        reg.lastIndex = 0;
        if (reg.test(n.nodeValue)) nodes.push(n);
    }
    nodes.forEach(node => {
        const frag = doc.createDocumentFragment();
        node.nodeValue.split(reg).forEach((part, idx) => {
            if (!part) return;
            if (idx % 2 === 1) {
                const mark = doc.createElement("mark");
                mark.textContent = part;
                frag.appendChild(mark);
            } else {
                frag.appendChild(doc.createTextNode(part));
            }
        });
        node.parentNode.replaceChild(frag, node);
    });
}

async function openRedContent(url, title, matches) {
    const statusBox = document.getElementById("status");
    const oldStatus = statusBox.innerText;
    statusBox.innerText = "正在抓取并处理套红页面...";

    // 先开窗口（在点击事件里同步打开，避免被浏览器拦截弹窗）
    const newWin = window.open("", "_blank");
    if (!newWin) { alert("请允许浏览器弹窗！"); statusBox.innerText = oldStatus; return; }
    newWin.document.write("<meta charset='utf-8'><p style='font:15px sans-serif;color:#7d776a;padding:40px'>正在载入…</p>");

    try {
        let html = await fetchPage(url);
        if (!html || html.length < 100) throw new Error("内容获取失败");
        let doc = new DOMParser().parseFromString(html, "text/html");

        // 与检测时相同的正文容器
        let box = doc.querySelector("#ozoom") || doc.querySelector("#articleContent") ||
                  doc.querySelector(".m-article-text") || doc.querySelector(".m-article-content") ||
                  doc.querySelector(".m-article-main") || doc.querySelector("founder-content");
        if (!box) box = doc.body;

        // 光明日报：把注释里的作者简介/图片说明放出来
        const cw = doc.createTreeWalker(box, NodeFilter.SHOW_COMMENT);
        const comments = [];
        let c;
        while ((c = cw.nextNode())) comments.push(c);
        comments.forEach(cm => {
            const tpl = doc.createElement("template");
            tpl.innerHTML = cm.nodeValue;
            cm.parentNode.replaceChild(tpl.content, cm);
        });

        // 去掉脚本、iframe、样式；补全图片链接
        box.querySelectorAll("script,iframe,style,link").forEach(e => e.remove());
        box.querySelectorAll("img").forEach(img => {
            const src = img.getAttribute("src");
            if (src) img.setAttribute("src", new URL(src, url).href);
            img.removeAttribute("style"); img.removeAttribute("width"); img.removeAttribute("height");
        });
        box.querySelectorAll("a[href]").forEach(a => { a.href = new URL(a.getAttribute("href"), url).href; a.target = "_blank"; });

        highlightNode(box, doc);

        const page = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【套红】${escapeHtml(title)}</title>
<style>
body{margin:0;background:#fbf8ea;color:#333;font:17px/2 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px 60px}
.head{border-bottom:1px solid #e3dcc4;padding-bottom:16px;margin-bottom:24px}
h1{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;font-size:26px;line-height:1.5;color:#222;margin:0 0 10px}
.meta{font-size:13px;color:#7d776a;line-height:1.8}
.meta b{color:#b3261e;font-weight:600}
.meta a{color:#1f6f6b}
.body{background:#fff;border:1px solid #e3dcc4;padding:28px 36px}
.body p{margin:0 0 1em}
.body img{max-width:100%;height:auto;display:block;margin:12px auto}
.body table{max-width:100%}
mark{background:#ffe866;color:#b3261e;font-weight:700;padding:0 2px;border-radius:2px}
</style></head><body><div class="wrap">
<div class="head"><h1>${escapeHtml(title)}</h1>
<div class="meta">命中：<b>${escapeHtml((matches || []).join("，"))}</b><br><a href="${escapeHtml(url)}" target="_blank">打开原文</a></div></div>
<div class="body">${box.innerHTML}</div></div></body></html>`;

        newWin.document.open();
        newWin.document.write(page);
        newWin.document.close();
    } catch (e) {
        newWin.close();
        alert("预览失败：" + e.message);
    } finally {
        statusBox.innerText = oldStatus;
    }
}
